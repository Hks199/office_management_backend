# Included inside nginx's http context through sites-enabled.
# setup.sh substitutes __API_DOMAIN__; Certbot adds HTTPS after DNS is ready.
limit_req_zone $binary_remote_addr zone=sunvika_office_requests:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=sunvika_office_connections:10m;
log_format sunvika_office '$remote_addr [$time_local] "$request_method" $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;

    # Also protects the API if this site becomes Nginx's default server.
    if ($host != __API_DOMAIN__) { return 444; }

    server_tokens off;
    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 30s;
    limit_req zone=sunvika_office_requests burst=40 nodelay;
    limit_req_status 429;
    limit_conn sunvika_office_connections 20;
    limit_conn_status 429;
    access_log /var/log/nginx/sunvika-office.access.log sunvika_office;
    error_log /var/log/nginx/sunvika-office.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Exactly one ingress hop; discard caller-provided forwarding headers.
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }
}
