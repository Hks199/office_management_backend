name: Deploy office backend to EC2

on:
  workflow_run:
    workflows: [Backend checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sunvika-office-production-${{ github.event.workflow_run.conclusion || 'success' }}-${{ github.event.workflow_run.event || 'push' }}-${{ github.event.workflow_run.head_repository.full_name || github.repository }}
  cancel-in-progress: false

jobs:
  eligible:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      promote: ${{ steps.current.outputs.promote }}
      source_sha: ${{ steps.current.outputs.source_sha }}
    steps:
      - name: Select current main commit with successful CI
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        shell: bash
        run: |
          set -euo pipefail
          skip_deployment() {
            echo 'promote=false' >> "$GITHUB_OUTPUT"
            printf '## Deployment skipped\n\n%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::$1"
            exit 0
          }
          reject_deployment() {
            echo 'promote=false' >> "$GITHUB_OUTPUT"
            printf '## Deployment blocked\n\n%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$1"
            exit 1
          }
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$DISPATCH_REF" == refs/heads/main ]] || reject_deployment 'Choose main when using Run workflow.'
          elif [[ "$EVENT_NAME" == workflow_run ]]; then
            if [[ "$SOURCE_EVENT" != push || "$SOURCE_CONCLUSION" != success || "$SOURCE_BRANCH" != main || "$SOURCE_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
              skip_deployment 'Only successful Backend checks for a main push from this repository deploy automatically.'
            fi
          else
            reject_deployment 'Unsupported deployment event.'
          fi
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || reject_deployment 'Invalid source commit.'
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_sha" != "$SOURCE_SHA" ]]; then
            if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
              reject_deployment 'Main changed. Run this workflow again using the latest main commit.'
            fi
            skip_deployment 'A newer main commit exists. This run did not upload or start an application.'
          fi
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            ci_result="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs"               -f branch=main -f event=push -f head_sha="$SOURCE_SHA" -f per_page=100               --jq '.workflow_runs | max_by(.run_number) | [.status // "missing", .conclusion // "missing", .head_sha // "missing", .head_repository.full_name // "missing", .event // "missing", .head_branch // "missing"] | @tsv')"
            IFS=$'\t' read -r ci_status ci_conclusion ci_sha ci_repository ci_event ci_branch <<< "$ci_result"
            if [[ "$ci_status" != completed || "$ci_conclusion" != success || "$ci_sha" != "$SOURCE_SHA" || "$ci_repository" != "$GITHUB_REPOSITORY" || "$ci_event" != push || "$ci_branch" != main ]]; then
              reject_deployment 'The latest Backend checks push run for this main commit must finish successfully before deployment. Wait for CI, then use Run workflow again.'
            fi
          fi
          printf 'promote=true\nsource_sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          printf '## Deployment selected\n\nCommit: %s\n\nPackaging and EC2 deployment still need to complete.\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

  package:
    needs: eligible
    if: needs.eligible.outputs.promote == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ needs.eligible.outputs.source_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.eligible.outputs.source_sha }}
          persist-credentials: false
      - name: Build and package the checked commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          release="${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir release
          docker build --pull --platform linux/amd64 --tag "sunvika-office-api:$release" .
          docker image save --output release/image.tar "sunvika-office-api:$release"
          cp deploy/ec2/image_identity.py release/image_identity.py
          python3 deploy/ec2/image_identity.py archive release/image.tar "sunvika-office-api:$release" > release/image.config.id
          cp docker-compose.production.yml release/compose.yaml
          tar -czf "$release.tar.gz" -C release image.tar image.config.id image_identity.py compose.yaml
          sha256sum "$release.tar.gz" > "$release.sha256"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ec2-release
          path: |
            *.tar.gz
            *.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: [eligible, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    env:
      SOURCE_SHA: ${{ needs.eligible.outputs.source_sha }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
      EC2_USER: ${{ vars.EC2_USER || 'ubuntu' }}
      EC2_SSH_PORT: ${{ vars.EC2_SSH_PORT || '22' }}
      RUN_INDEX_MIGRATION: ${{ vars.RUN_INDEX_MIGRATION || 'false' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.eligible.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ec2-release
      - name: Prepare private environment from GitHub secrets and variables
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI || vars.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || vars.JWT_SECRET }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY || vars.TOKEN_ENCRYPTION_KEY }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS || vars.CORS_ORIGINS }}
          CREDENTIAL_UI_ORIGIN: ${{ secrets.CREDENTIAL_UI_ORIGIN || vars.CREDENTIAL_UI_ORIGIN }}
          AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET || vars.S3_BUCKET }}
          TRUST_PROXY_HOPS: ${{ secrets.TRUST_PROXY_HOPS || vars.TRUST_PROXY_HOPS }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL || vars.LOG_LEVEL }}
          RATE_LIMIT_MAX: ${{ secrets.RATE_LIMIT_MAX || vars.RATE_LIMIT_MAX }}
          RATE_LIMIT_WINDOW_MS: ${{ secrets.RATE_LIMIT_WINDOW_MS || vars.RATE_LIMIT_WINDOW_MS }}
          MONGODB_MAX_POOL_SIZE: ${{ secrets.MONGODB_MAX_POOL_SIZE || vars.MONGODB_MAX_POOL_SIZE }}
          MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${{ secrets.MONGODB_SERVER_SELECTION_TIMEOUT_MS || vars.MONGODB_SERVER_SELECTION_TIMEOUT_MS }}
          MONGODB_WAIT_QUEUE_TIMEOUT_MS: ${{ secrets.MONGODB_WAIT_QUEUE_TIMEOUT_MS || vars.MONGODB_WAIT_QUEUE_TIMEOUT_MS }}
          SLOW_QUERY_MS: ${{ secrets.SLOW_QUERY_MS || vars.SLOW_QUERY_MS }}
          BODY_LIMIT_BYTES: ${{ secrets.BODY_LIMIT_BYTES || vars.BODY_LIMIT_BYTES }}
          SHUTDOWN_TIMEOUT_MS: ${{ secrets.SHUTDOWN_TIMEOUT_MS || vars.SHUTDOWN_TIMEOUT_MS }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER || vars.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE || vars.JWT_AUDIENCE }}
          ACCESS_TTL_SECONDS: ${{ secrets.ACCESS_TTL_SECONDS || vars.ACCESS_TTL_SECONDS }}
          REFRESH_TTL_DAYS: ${{ secrets.REFRESH_TTL_DAYS || vars.REFRESH_TTL_DAYS }}
          REFRESH_ABSOLUTE_DAYS: ${{ secrets.REFRESH_ABSOLUTE_DAYS || vars.REFRESH_ABSOLUTE_DAYS }}
          CREDENTIAL_DELIVERY_ENABLED: ${{ secrets.CREDENTIAL_DELIVERY_ENABLED || vars.CREDENTIAL_DELIVERY_ENABLED }}
          CREDENTIAL_DELIVERY_INTERVAL_MS: ${{ secrets.CREDENTIAL_DELIVERY_INTERVAL_MS || vars.CREDENTIAL_DELIVERY_INTERVAL_MS }}
          COMMERCIAL_JOBS_ENABLED: ${{ secrets.COMMERCIAL_JOBS_ENABLED || vars.COMMERCIAL_JOBS_ENABLED }}
          COMMERCIAL_JOBS_INTERVAL_MS: ${{ secrets.COMMERCIAL_JOBS_INTERVAL_MS || vars.COMMERCIAL_JOBS_INTERVAL_MS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || vars.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || vars.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE || vars.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER || vars.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || vars.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM || vars.MAIL_FROM }}
          MIGRATION_MONGODB_URI: ${{ secrets.MIGRATION_MONGODB_URI || vars.MIGRATION_MONGODB_URI }}
        shell: bash
        run: python3 deploy/ec2/render_env.py --output-dir "$RUNNER_TEMP/office_ec2_config"
      - name: Configure verified SSH connection
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EC2_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo 'Invalid EC2_HOST'; exit 1; }
          [[ "$EC2_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'Invalid EC2_USER'; exit 1; }
          if [[ ! "$EC2_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || (( 10#$EC2_SSH_PORT < 1 || 10#$EC2_SSH_PORT > 65535 )); then
            echo 'Invalid EC2_SSH_PORT'
            exit 1
          fi
          [[ "$RUN_INDEX_MIGRATION" == true || "$RUN_INDEX_MIGRATION" == false ]]
          [[ -n "$EC2_SSH_KEY" && -n "$EC2_KNOWN_HOSTS" ]] || { echo 'Missing SSH secrets'; exit 1; }
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/office_ec2_key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$RUNNER_TEMP/office_ec2_known_hosts"
          cat > ~/.ssh/config <<EOF
          Host office-ec2
            HostName $EC2_HOST
            User $EC2_USER
            Port $EC2_SSH_PORT
            IdentityFile $RUNNER_TEMP/office_ec2_key
            UserKnownHostsFile $RUNNER_TEMP/office_ec2_known_hosts
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF
      - name: Confirm selected commit is still current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_sha" != "$SOURCE_SHA" ]]; then
            echo '::error::Main changed during packaging. Run deployment for the latest checked main commit.'
            exit 1
          fi
      - name: Check deployment server
        shell: bash
        run: |
          ssh office-ec2 'bash -se' <<'REMOTE'
          printf 'Connected server: '
          hostname
          printf 'Deployment user: '
          id -un
          cd /opt/sunvika-office
          printf 'Deployment directory: %s\n' "$PWD"
          test -d incoming
          test -d releases
          test -r shared/backend.env
          sudo -n true
          docker info >/dev/null
          docker compose version
          REMOTE
      - name: Upload and deploy release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          release="${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sha256sum --check "$release.sha256"
          scp "$release.tar.gz" "$release.sha256" office-ec2:/opt/sunvika-office/incoming/
          scp deploy/ec2/deploy.sh "office-ec2:/opt/sunvika-office/incoming/$release-deploy.sh"
          # The release identifier is validated locally before expansion.
          # shellcheck disable=SC2029
          ssh office-ec2 "sudo -n install -o root -g root -m 0755 '/opt/sunvika-office/incoming/$release-deploy.sh' /usr/local/bin/sunvika-office-deploy && rm -f '/opt/sunvika-office/incoming/$release-deploy.sh'"
          # The release identifier is validated locally before expansion.
          # shellcheck disable=SC2029
          ssh office-ec2 "umask 077; mkdir -m 0700 '/opt/sunvika-office/incoming/$release-config'"
          env_files=("$RUNNER_TEMP/office_ec2_config/backend.env")
          if [[ "$RUN_INDEX_MIGRATION" == true ]]; then
            env_files+=("$RUNNER_TEMP/office_ec2_config/migrate.env")
          fi
          scp "${env_files[@]}" "office-ec2:/opt/sunvika-office/incoming/$release-config/"
          # The release identifier is validated locally before expansion.
          # shellcheck disable=SC2029
          ssh office-ec2 "/usr/local/bin/sunvika-office-deploy '$release' '$RUN_INDEX_MIGRATION' github"
      - name: Verify active EC2 release
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          release="${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # The release identifier is validated locally before expansion.
          # shellcheck disable=SC2029
          ssh office-ec2 "bash -se -- '$release'" <<'REMOTE'
          release="$1"
          cd /opt/sunvika-office
          [[ "$(readlink -f current)" == "$PWD/releases/$release" ]]
          [[ "$(cat current/image.id)" =~ ^sha256:[a-f0-9]{64}$ ]]
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3000/api/v1/health/ready >/dev/null
          printf 'Verified active release: %s\n' "$release"
          REMOTE
      - name: Remove remote staged environment
        if: always() && steps.ssh.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          release="${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # The release identifier is validated locally before expansion.
          # shellcheck disable=SC2029
          ssh office-ec2 "rm -f '/opt/sunvika-office/incoming/$release-deploy.sh' '/opt/sunvika-office/incoming/$release-config/backend.env' '/opt/sunvika-office/incoming/$release-config/migrate.env'; if [ -d '/opt/sunvika-office/incoming/$release-config' ]; then rmdir '/opt/sunvika-office/incoming/$release-config'; fi"
      - name: Remove local environment and SSH material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/office_ec2_config/backend.env" "$RUNNER_TEMP/office_ec2_config/migrate.env" "$RUNNER_TEMP/office_ec2_key" "$RUNNER_TEMP/office_ec2_known_hosts" ~/.ssh/config
      - name: Report deployment result
        if: always()
        env:
          VERIFICATION_RESULT: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          if [[ "$VERIFICATION_RESULT" == success ]]; then
            printf '## Deployed to EC2\n\nCommit: %s\n\nThe active release, image ID, and local readiness endpoint were verified. See **Check deployment server** for the hostname.\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## Deployment did not complete\n\nInspect the failed step above. A successful Backend checks run alone does not create a release on EC2.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
